<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>التسجيل في الدورات التدريبية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: white;
      padding: 55px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .header p {
      font-size: 17px;
      opacity: 0.9;
    }

    .container {
      max-width: 750px;
      margin: -30px auto 50px;
      padding: 0 20px;
      position: relative;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #111827;
    }

    .description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
      background: #f9fafb;
    }

    .required {
      color: #dc2626;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .note {
      margin-top: 20px;
      padding: 15px;
      background: #eff6ff;
      border-radius: 10px;
      color: #1e40af;
      line-height: 1.7;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      padding: 25px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 25px;
      }

      .card {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>🎓 التسجيل في الدورات التدريبية</h1>
    <p>سجل بياناتك وسيتم التواصل معك عبر WhatsApp</p>
  </header>

  <main class="container">

    <div class="card">

      <h2>نموذج التسجيل</h2>

      <p class="description">
        يرجى تعبئة البيانات التالية بشكل صحيح،
        وسيقوم فريقنا بالتواصل معك بعد مراجعة طلبك.
      </p>

      <form id="registrationForm">

        <div class="form-group">
          <label>
            الاسم الكامل <span class="required">*</span>
          </label>
          <input
            type="text"
            name="name"
            placeholder="اكتب اسمك الكامل"
            required
          >
        </div>

        <div class="form-group">
          <label>
            رقم WhatsApp <span class="required">*</span>
          </label>
          <input
            type="tel"
            name="phone"
            placeholder="مثال: 9677XXXXXXXX"
            required
          >
        </div>

        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input
            type="email"
            name="email"
            placeholder="example@email.com"
          >
        </div>

        <div class="form-group">
          <label>
            التخصص المهني <span class="required">*</span>
          </label>

          <select name="specialization" required>
            <option value="">-- اختر تخصصك --</option>
            <option>إدارة الأعمال</option>
            <option>المحاسبة والمالية</option>
            <option>تقنية المعلومات</option>
            <option>البرمجة</option>
            <option>التسويق</option>
            <option>الموارد البشرية</option>
            <option>الهندسة</option>
            <option>الطب والصحة</option>
            <option>التعليم والتدريب</option>
            <option>الإعلام</option>
            <option>أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label>المؤهل العلمي</label>

          <select name="qualification">
            <option value="">-- اختر المؤهل --</option>
            <option>ثانوية عامة</option>
            <option>دبلوم</option>
            <option>بكالوريوس</option>
            <option>ماجستير</option>
            <option>دكتوراه</option>
            <option>أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label>سنوات الخبرة</label>

          <select name="experience">
            <option value="">-- اختر --</option>
            <option>بدون خبرة</option>
            <option>أقل من سنة</option>
            <option>1 - 3 سنوات</option>
            <option>3 - 5 سنوات</option>
            <option>أكثر من 5 سنوات</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            الدورة التي ترغب بها <span class="required">*</span>
          </label>

          <select name="course" required>
            <option value="">-- اختر الدورة --</option>
            <option>دورة سيتم الإعلان عنها لاحقًا</option>
            <option>التدريب المهني</option>
            <option>تطوير المهارات</option>
            <option>القيادة والإدارة</option>
            <option>التسويق الرقمي</option>
            <option>تقنية المعلومات</option>
          </select>
        </div>

        <div class="form-group">
          <label>السيرة الذاتية (CV)</label>

          <input
            type="file"
            name="cv"
            accept=".pdf,.doc,.docx"
          >
        </div>

        <div class="form-group">
          <label>نبذة عنك</label>

          <textarea
            name="message"
            placeholder="اكتب نبذة مختصرة عن خبرتك أو أهدافك التدريبية..."
          ></textarea>
        </div>

        <button type="submit" class="submit-btn">
          إرسال طلب التسجيل
        </button>

        <div class="note">
          🔒 سيتم استخدام بياناتك لغرض التسجيل والتواصل معك بخصوص
          الدورات التدريبية فقط.
        </div>

      </form>

    </div>

  </main>

  <footer class="footer">
    © 2026 جميع الحقوق محفوظة
  </footer>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
      event.preventDefault();

      alert("تم استلام طلبك بنجاح. سيتم التواصل معك عبر WhatsApp.");

      this.reset();
    });
  </script>

</body>
</html>
